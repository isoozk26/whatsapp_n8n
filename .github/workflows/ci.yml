name: ci
on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: python build_workflow.py
      - run: python build_ops_workflow.py
      - run: python tools/check_workflow_drift.py
      - run: python tools/test_workflow_contract.py
      - run: node tools/test_workflow_behavior.js
      - run: python tools/test_outbound_guard.py
      - run: python tools/wf_validate.py workflow.json
      - run: python tools/wf_security.py
      - run: |
          for migration in \
            db/migrations/001_whatsapp_state.sql \
            db/migrations/002_catalog_resilience.sql \
            db/migrations/003_delivery_metrics.sql \
            db/migrations/052_ooh_log.sql \
            db/migrations/054_reconcile_delivery_priority_schema.sql \
            db/migrations/055_stale_batch_monitor.sql \
            db/migrations/056_chat_memory.sql \
            db/migrations/057_admin_number_filter.sql \
            db/migrations/058_daily_report_emoji.sql \
            db/migrations/059_queue_monitor_defer_fix.sql \
            db/migrations/060_ooh_manager_outbox.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d whatsapp_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -h localhost -U postgres -d whatsapp_test -f db/tests/catalog_resilience.sql
      - run: python tools/test_migrations_058_060.py
